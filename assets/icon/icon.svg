<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F4F3A"/>
      <stop offset="55%" stop-color="#1E7F5C"/>
      <stop offset="100%" stop-color="#0B3D3A"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0CF6B"/>
      <stop offset="100%" stop-color="#B8902F"/>
    </linearGradient>
  </defs>

  <!-- Background with rounded square (iOS-style mask handled by launcher tool) -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" fill="url(#halo)"/>

  <!-- Decorative geometric ring (subtle Islamic-art inspired) -->
  <g stroke="#C9A14A" stroke-opacity="0.18" fill="none" stroke-width="3">
    <circle cx="512" cy="540" r="380"/>
    <circle cx="512" cy="540" r="330"/>
  </g>

  <!-- 8-point star pattern behind the mosque -->
  <g transform="translate(512 540)" fill="#FFFFFF" fill-opacity="0.05">
    <polygon points="0,-360 60,-130 280,-200 130,-30 360,40 130,80 200,300 50,120 0,360 -50,120 -200,300 -130,80 -360,40 -130,-30 -280,-200 -60,-130"/>
  </g>

  <!-- Crescent moon + star at the top -->
  <g transform="translate(512 200)">
    <path d="M 0 -70 A 70 70 0 1 0 0 70 A 56 56 0 1 1 0 -70 Z" fill="url(#gold)"/>
    <polygon points="92,-12 105,15 134,18 113,38 119,66 92,52 65,66 71,38 50,18 79,15" fill="url(#gold)"/>
  </g>

  <!-- Mosque silhouette: minarets + central dome -->
  <g fill="url(#gold)">
    <!-- Left minaret -->
    <rect x="278" y="500" width="46" height="270" rx="6"/>
    <polygon points="278,500 324,500 301,440"/>
    <circle cx="301" cy="430" r="14"/>
    <rect x="270" y="496" width="62" height="14" rx="4"/>

    <!-- Right minaret -->
    <rect x="700" y="500" width="46" height="270" rx="6"/>
    <polygon points="700,500 746,500 723,440"/>
    <circle cx="723" cy="430" r="14"/>
    <rect x="692" y="496" width="62" height="14" rx="4"/>

    <!-- Central dome -->
    <path d="M 360 600
             C 360 460, 664 460, 664 600
             L 664 770
             L 360 770
             Z"/>
    <!-- Dome finial spike -->
    <rect x="506" y="380" width="12" height="80" rx="3"/>
    <circle cx="512" cy="370" r="14"/>
    <!-- Tiny crescent on dome top -->
    <path d="M 512 350 A 18 18 0 1 0 512 314 A 14 14 0 1 1 512 350 Z" fill="url(#gold)"/>

    <!-- Mosque base / floor -->
    <rect x="240" y="770" width="544" height="40" rx="8"/>
    <rect x="200" y="810" width="624" height="20" rx="8"/>
  </g>

  <!-- Doorway arch carved into the dome -->
  <path d="M 470 770
           L 470 680
           C 470 620, 554 620, 554 680
           L 554 770 Z"
        fill="#0B3D3A"/>

  <!-- Two small side windows -->
  <g fill="#0B3D3A">
    <path d="M 400 770 L 400 700 C 400 670, 440 670, 440 700 L 440 770 Z"/>
    <path d="M 584 770 L 584 700 C 584 670, 624 670, 624 700 L 624 770 Z"/>
  </g>
</svg>
